openapi: 3.1.0
info:
  title: API del Catálogo Oficial — Hoja de Vida UNIMINUTO
  version: 1.0.0
  description: >
    Catálogo de colegios (MEN, datos.gov.co cfw5-qzt5) e instituciones de educación
    superior (SNIES, n5yy-8nav). Base de datos propia, actualizada a diario con
    Write-Audit-Publish. Historial como dimensión lentamente cambiante tipo 2.
servers:
  - url: /api/catalogo/v1
security:
  - llaveApi: []
paths:
  /colegios:
    get:
      summary: Busca colegios vigentes por nombre (autocompletar)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3 } }
        - { name: municipio, in: query, required: false, description: Código DANE del municipio, schema: { type: string } }
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Colegios vigentes ordenados por similitud
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Colegio" } }
        "401": { $ref: "#/components/responses/SinLlave" }
  /colegios/{codigoDane}:
    get:
      summary: Versión vigente de un colegio
      parameters:
        - { name: codigoDane, in: path, required: true, schema: { type: string, pattern: "^[0-9]{12}$" } }
      responses:
        "200":
          description: Colegio vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Colegio" }
        "404": { description: El código no existe en el catálogo }
        "401": { $ref: "#/components/responses/SinLlave" }
  /colegios/{codigoDane}/versiones:
    get:
      summary: Historial completo del colegio (SCD tipo 2)
      parameters:
        - { name: codigoDane, in: path, required: true, schema: { type: string, pattern: "^[0-9]{12}$" } }
      responses:
        "200":
          description: Todas las versiones, la vigente primero
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Colegio" } }
        "401": { $ref: "#/components/responses/SinLlave" }
  /ies:
    get:
      summary: Busca instituciones de educación superior vigentes
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3 } }
      responses:
        "200":
          description: Instituciones vigentes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Institucion" } }
        "401": { $ref: "#/components/responses/SinLlave" }
  /cargas:
    get:
      summary: Bitácora de cargas (linaje)
      parameters:
        - { name: fuente, in: query, required: false, schema: { type: string, enum: [colegios_men, snies_ies] } }
      responses:
        "200":
          description: Cargas, la más reciente primero
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Carga" } }
        "401": { $ref: "#/components/responses/SinLlave" }
components:
  securitySchemes:
    llaveApi: { type: apiKey, in: header, name: X-Api-Key }
  responses:
    SinLlave: { description: Falta la cabecera X-Api-Key o no es válida }
  schemas:
    Colegio:
      type: object
      required: [versionId, codigoDane, nombre, municipio, sector, vigenteDesde, esActual]
      properties:
        versionId: { type: integer, description: Llave sustituta de la versión }
        codigoDane: { type: string }
        nombre: { type: string }
        departamento: { type: string }
        municipio: { type: string }
        codDaneMunicipio: { type: string }
        sector: { type: string, enum: [OFICIAL, NO_OFICIAL] }
        calendario: { type: [string, "null"] }
        vigenteDesde: { type: string, format: date-time }
        vigenteHasta: { type: [string, "null"], format: date-time }
        esActual: { type: boolean }
        fuente:
          type: object
          properties:
            datasetId: { type: string, example: cfw5-qzt5 }
            cargaId: { type: integer }
    Institucion:
      type: object
      required: [versionId, codigoSnies, nombre, esActual]
      properties:
        versionId: { type: integer }
        codigoSnies: { type: string }
        nombre: { type: string }
        caracterAcademico: { type: [string, "null"] }
        esActual: { type: boolean }
    Carga:
      type: object
      properties:
        id: { type: integer }
        fuente: { type: string }
        versionFuente: { type: [string, "null"], format: date-time }
        sha256: { type: [string, "null"] }
        filasLeidas: { type: integer }
        filasValidas: { type: integer }
        nuevas: { type: integer }
        cambiadas: { type: integer }
        dadasDeBaja: { type: integer }
        estado: { type: string, enum: [ESCRITA, AUDITADA, PUBLICADA, RECHAZADA, SIN_CAMBIOS] }
        iniciadaEn: { type: string, format: date-time }
