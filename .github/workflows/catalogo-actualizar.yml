name: Actualizar catálogo oficial

on:
  schedule:
    - cron: "0 8 * * *" # 3:00 a. m. hora de Colombia (UTC-5)
  workflow_dispatch:
    inputs:
      forzar:
        description: "Descargar aunque la fuente no haya cambiado"
        type: boolean
        default: false

concurrency:
  group: catalogo-actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CATALOGO_DATABASE_URL: ${{ secrets.CATALOGO_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema prisma/catalogo/schema.prisma
      - run: npx prisma migrate deploy --schema prisma/catalogo/schema.prisma
      - name: Write → Audit → Publish
        run: npm run catalogo:actualizar -- --fuente colegios_men ${{ inputs.forzar && '--forzar' || '' }}
